name: Continuous integration

on:
  push:
  workflow_dispatch:
    inputs:
      run_type:
        description: Choose which checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - code-quality
          - performance

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm test

      - name: Check formatting
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm format:check

      - name: Upload site build
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.run_type != 'code-quality')
          }}
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .svelte-kit/cloudflare
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  performance:
    name: Lighthouse performance
    needs: quality
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_type != 'code-quality')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: .svelte-kit/cloudflare

      - name: Start local site
        run: |
          pnpm exec wrangler dev \
            --local \
            --ip 127.0.0.1 \
            --port 8787 \
            --show-interactive-dev-session=false \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/wrangler.pid"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-delay 1 \
            --retry-all-errors \
            http://127.0.0.1:8787/ \
            > /dev/null

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:8787/
            http://127.0.0.1:8787/on
            http://127.0.0.1:8787/archive
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Show local site log on failure
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/wrangler.log"

      - name: Stop local site
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/wrangler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/wrangler.pid")" || true
          fi
