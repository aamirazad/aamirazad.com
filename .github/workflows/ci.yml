name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_type:
        description: Choose which checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - code-quality

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm test

      - name: Check formatting
        if: ${{ github.event_name == 'push' || inputs.run_type != 'performance' }}
        run: pnpm format:check

      - name: Upload site build
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.run_type != 'code-quality')
          }}
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: .svelte-kit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
