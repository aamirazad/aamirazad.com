name: Code quality

on:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    # The push event supplies the message for the commit that triggered this run.
    if: ${{ !startsWith(github.event.head_commit.message, '[SKIP CI]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check
